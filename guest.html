<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهمان | عمار حلب</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">ع</span><span><b>عمار حلب</b><small>بخش مهمان</small></span></a><nav><a href="index.html">خانه</a><a href="admin.html">ادمین</a></nav></div></header>
<main class="wrap"><section class="section"><div class="head"><div><h2>یادمان شهید محمد خانی</h2><p>محتوای منتشرشده</p></div></div><div class="card"><div class="field"><label>نام نمایشی شما</label><input id="guestName" placeholder="مثلاً محمد"></div><div class="notice" style="margin:0">برای ثبت نظر، نام نمایشی وارد کن.</div></div></section><section class="section"><div id="posts" class="grid"><div class="empty">در حال دریافت محتوا...</div></div></section></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="card modalbox"><div class="head"><h2 id="modalTitle">نمایش</h2><button class="btn danger" onclick="closeModal()">بستن</button></div><div id="viewer" class="viewer"></div><a id="downloadLink" class="btn gold" style="margin-top:10px" download>⬇ دریافت فایل</a></div></div><div id="toastbox" class="toastbox"></div>
<script>
let posts=[],comments=[],likes=[],session=null;
const nameInput=document.getElementById("guestName");nameInput.value=localStorage.getItem("ah_name")||"";nameInput.oninput=()=>localStorage.setItem("ah_name",nameInput.value.trim());
function kind(m,p){if(m&&m.startsWith("video/"))return"فیلم";if(m&&m.startsWith("image/"))return"تصویر";if(m&&m.startsWith("audio/"))return"صدا";const e=p.split(".").pop().toLowerCase();return e==="pdf"?"PDF":(e==="html"||e==="htm")?"HTML":"فایل";}
function icon(k){return({"فیلم":"🎬","تصویر":"🖼️","صدا":"🎵","PDF":"📕","HTML":"🌐","فایل":"📦"})[k]||"📦";}
async function boot(){if(!guard()){document.getElementById("posts").innerHTML='<div class="empty">ابتدا سرور را در supabase-config.js تنظیم کن.</div>';return;}try{let r=await sb.auth.getSession();session=r.data.session;if(!session){r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session;}await load();sb.channel("guest-posts").on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},load).subscribe();}catch(e){toast("خطا",e.message||"دریافت اطلاعات ناموفق بود.");}}
async function load(){posts=await getPosts();comments=await getComments();likes=await getLikes();await render();}
async function render(){const box=document.getElementById("posts");if(!posts.length){box.innerHTML='<div class="empty">هنوز محتوایی منتشر نشده است.</div>';return;}let html=[];for(const p of posts){const url=await fileUrl(p.file_path),cs=comments.filter(c=>c.post_id===p.id),lc=likes.filter(l=>l.post_id===p.id).length;let thumb='<div class="icon">'+icon(kind(p.mime_type,p.file_path))+'</div>';if(p.mime_type&&p.mime_type.startsWith("image/"))thumb='<img src="'+url+'" alt="">';if(p.mime_type&&p.mime_type.startsWith("video/"))thumb='<video src="'+url+'" muted></video>';html.push('<article class="card post"><div class="thumb">'+thumb+'</div><div class="postbody"><h3>'+esc(p.title)+'</h3><div class="desc">'+esc(p.description||"بدون توضیحات")+'</div><div class="row"><span class="pill">'+kind(p.mime_type,p.file_path)+'</span><span class="pill">❤️ '+lc+'</span><span class="pill">'+dateFa(p.created_at)+'</span></div><div class="row"><button class="btn green" onclick="openPost('+p.id+')">▶ نمایش</button><a class="btn" href="'+url+'" download>⬇ دریافت</a></div><div class="sep"></div><textarea id="c_'+p.id+'" placeholder="نظر خودت را بنویس..."></textarea><div class="row"><button class="btn gold" onclick="sendComment('+p.id+')">💬 ارسال نظر</button><button class="btn" onclick="sendLike('+p.id+')">❤️ قلب</button></div><div>'+(cs.length?cs.map(c=>'<div class="comment"><small>'+esc(c.guest_name||"مهمان")+' • '+dateFa(c.created_at)+'</small><p>'+esc(c.body)+'</p></div>').join(""):'<small style="display:block;margin-top:8px;color:#718078">هنوز نظری ثبت نشده است.</small>')+'</div></div></article>');}box.innerHTML=html.join("");}
async function sendComment(id){const guest_name=nameInput.value.trim(),body=document.getElementById("c_"+id).value.trim();if(!guest_name||!body){toast("نظر کامل نیست","نام نمایشی و متن نظر را وارد کن.");return;}const r=await sb.from("comments").insert({post_id:id,user_id:session.user.id,guest_name,body});if(r.error){toast("خطا",r.error.message);return;}document.getElementById("c_"+id).value="";await load();toast("ثبت شد","نظر ارسال شد.");}
async function sendLike(id){const r=await sb.from("likes").insert({post_id:id,user_id:session.user.id});if(r.error){toast(r.error.code==="23505"?"قبلاً قلب زده‌ای":"خطا",r.error.code==="23505"?"برای هر محتوا یک قلب کافی است.":r.error.message);return;}await load();toast("❤️","قلب ثبت شد.");}
async function openPost(id){const p=posts.find(x=>x.id===id),u=await fileUrl(p.file_path),v=document.getElementById("viewer");document.getElementById("modalTitle").textContent=p.title;v.innerHTML="";let el;if(p.mime_type&&p.mime_type.startsWith("video/")){el=document.createElement("video");el.controls=true;el.autoplay=true;}else if(p.mime_type&&p.mime_type.startsWith("image/")){el=document.createElement("img");}else if(p.mime_type&&p.mime_type.startsWith("audio/")){el=document.createElement("audio");el.controls=true;}else{el=document.createElement("iframe");}el.src=u;v.appendChild(el);document.getElementById("downloadLink").href=u;document.getElementById("downloadLink").download=p.file_path.split("/").pop();document.getElementById("modal").classList.remove("hidden");}
function closeModal(){document.getElementById("modal").classList.add("hidden");document.getElementById("viewer").innerHTML="";}
boot();
</script></body></html>
