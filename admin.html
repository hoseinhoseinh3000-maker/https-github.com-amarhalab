<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ادمین | عمار حلب</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">ع</span><span><b>عمار حلب</b><small>پنل مدیریت</small></span></a><nav><a href="index.html">خانه</a><a href="guest.html">نمای مهمان</a></nav></div></header>
<div id="login" class="auth"><div class="card authbox"><div class="head"><div><h2>ورود ادمین</h2><p>مدیریت محتوای عمار حلب</p></div></div><div class="field"><label>ایمیل ادمین</label><input id="email" type="email" placeholder="admin@example.com"></div><div class="field"><label>رمز عبور</label><input id="password" type="password"></div><button class="btn gold" style="width:100%" onclick="login()">ورود به پنل</button><div class="notice">فقط حسابی که نقش admin در جدول profiles دارد اجازهٔ مدیریت سایت را می‌گیرد.</div></div></div>
<main id="panel" class="wrap hidden"><div class="admin"><aside class="sticky"><div class="card"><div class="head"><div><h2>انتشار محتوا</h2><p>فیلم، تصویر، PDF یا فایل پروژه</p></div></div><div class="field"><label>عنوان</label><input id="title" placeholder="عنوان محتوا"></div><div class="field"><label>توضیحات</label><textarea id="description" placeholder="توضیح کوتاه"></textarea></div><div class="field"><label>انتخاب فایل (حداکثر 50 مگابایت)</label><input id="file" type="file"></div><button class="btn green" style="width:100%" onclick="uploadPost()">📤 انتشار</button><div class="sep"></div><button class="btn" style="width:100%" onclick="logout()">خروج از ادمین</button></div></aside><section><div class="head"><div><h2>اعلان‌های زنده</h2><p>نظرها و قلب‌های مهمان‌ها</p></div><span id="live" class="pill">● آماده</span></div><div id="notes" class="notes"></div><div class="section"><div class="head"><div><h2>محتوای منتشرشده</h2><p>مدیریت فایل‌ها</p></div></div><div id="posts" class="grid"></div></div></section></div></main><div id="toastbox" class="toastbox"></div>
<script>
let session=null,posts=[],comments=[],likes=[];
async function boot(){if(!guard())return;const r=await sb.auth.getSession();session=r.data.session;if(session)await authorize();}
async function login(){if(!guard())return;const r=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(r.error){toast("ورود ناموفق",r.error.message);return;}session=r.data.session;await authorize();}
async function authorize(){const r=await sb.rpc("is_admin");if(r.error||!r.data){await sb.auth.signOut();session=null;toast("دسترسی رد شد","این حساب نقش admin ندارد.");return;}document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");await load();sb.channel("admin-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"comments"},async p=>{toast("💬 نظر جدید",p.new.body);document.getElementById("live").textContent="● اعلان جدید";await load();}).on("postgres_changes",{event:"INSERT",schema:"public",table:"likes"},async p=>{toast("❤️ قلب جدید","برای یک محتوا قلب ثبت شد.");document.getElementById("live").textContent="● اعلان جدید";await load();}).subscribe();}
async function load(){posts=await getPosts();comments=await getComments();likes=await getLikes();renderPosts();renderNotes();}
function renderNotes(){const items=comments.map(c=>({title:"💬 نظر جدید",body:(c.guest_name||"مهمان")+": "+c.body,date:c.created_at})).concat(likes.map(l=>({title:"❤️ قلب جدید",body:"یک قلب برای محتوا ثبت شد",date:l.created_at}))).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,50);document.getElementById("notes").innerHTML=items.length?items.map(n=>'<div class="note"><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p><small>'+dateFa(n.date)+'</small></div>').join(""):'<div class="empty">هنوز اعلانی وجود ندارد.</div>';}
function renderPosts(){const b=document.getElementById("posts");b.innerHTML=posts.length?posts.map(p=>'<article class="card"><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||"")+'</p><div class="row"><span class="pill">❤️ '+likes.filter(l=>l.post_id===p.id).length+'</span><span class="pill">💬 '+comments.filter(c=>c.post_id===p.id).length+'</span><button class="btn danger" onclick="removePost('+p.id+')">حذف</button></div></article>').join(""):'<div class="empty">هنوز محتوایی منتشر نشده است.</div>';}
async function uploadPost(){const f=document.getElementById("file").files[0];if(!f){toast("فایل انتخاب نشده","یک فایل انتخاب کن.");return;}if(f.size>50*1024*1024){toast("فایل بزرگ است","حداکثر اندازهٔ فایل 50MB است.");return;}const path=Date.now()+"_"+f.name.replace(/[^\w.\-آ-ی]+/g,"_");let r=await sb.storage.from("media").upload(path,f,{upsert:false});if(r.error){toast("آپلود ناموفق",r.error.message);return;}r=await sb.from("posts").insert({title:document.getElementById("title").value.trim()||f.name,description:document.getElementById("description").value.trim(),file_path:path,mime_type:f.type});if(r.error){await sb.storage.from("media").remove([path]);toast("خطا",r.error.message);return;}document.getElementById("title").value="";document.getElementById("description").value="";document.getElementById("file").value="";await load();toast("منتشر شد","محتوا روی سرور ذخیره شد.");}
async function removePost(id){if(!confirm("این محتوا حذف شود؟"))return;const p=posts.find(x=>x.id===id);if(!p)return;let r=await sb.storage.from("media").remove([p.file_path]);if(r.error){toast("خطا",r.error.message);return;}r=await sb.from("posts").delete().eq("id",id);if(r.error){toast("خطا",r.error.message);return;}await load();toast("حذف شد","محتوا حذف شد.");}
async function logout(){await sb.auth.signOut();location.reload();}
boot();
</script></body></html>
